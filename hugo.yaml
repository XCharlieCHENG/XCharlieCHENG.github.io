baseURL: "https://charliecheng.cc/"
locale: "en-us"
title: "Xiang (Charlie) Cheng"
theme: "PaperMod"

enableRobotsTXT: true
enableEmoji: true
buildDrafts: false
buildFuture: false
buildExpired: false

pagination:
  pagerSize: 20

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production
  title: "Xiang (Charlie) Cheng"
  description: "Xiang Cheng (Charlie) is a Ph.D. student in Information Systems at the Robert H. Smith School of Business, University of Maryland, College Park. His research covers the economic impacts and business applications of generative AI."
  author: "Xiang Cheng"
  keywords:
    - generative AI
    - information systems
    - large language models
    - analytical modeling

  defaultTheme: auto
  ShowReadingTime: false
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: false
  ShowCodeCopyButtons: true
  ShowWordCount: false
  ShowRssButtonInSectionTermList: false
  ShowToc: false
  disableAnchoredHeadings: true
  disableSpecial1stPost: true

  # The homepage is PaperMod's profile mode: a centred headshot, name, a short
  # subtitle, the social icons, and one button per section. The theme renders
  # this partial INSTEAD of content/_index.md, so that file holds front matter
  # only and every homepage string lives here.
  profileMode:
    enabled: true
    title: "Xiang (Charlie) Cheng"
    subtitle: |
      I am a Ph.D. student in Information Systems at the [Robert H. Smith School of Business](https://www.rhsmith.umd.edu/), [University of Maryland, College Park](https://umd.edu/).

      I work on the economics of generative AI and AI agents, and on large language models as instruments for research and decision-making.
    imageUrl: "images/charlie.jpg"
    imageTitle: "Xiang (Charlie) Cheng"
    imageWidth: 160
    imageHeight: 160
    buttons:
      - name: Research
        url: /research/
      - name: Teaching
        url: /teaching/
      - name: CV
        url: /cv/
      - name: Impact
        url: /impact/

  # Points at a section that does not exist, so nothing is listed underneath
  # the homepage.
  mainSections:
    - posts

  socialIcons:
    - name: googlescholar
      title: "Google Scholar"
      url: "https://scholar.google.com/citations?hl=en&user=IRNpDrIAAAAJ"
    - name: linkedin
      title: "LinkedIn"
      url: "https://www.linkedin.com/in/xiang-charlie-cheng"
    - name: email
      title: "Email"
      url: "mailto:xccheng@umd.edu"

  assets:
    disableHLJS: true
    disableFingerprinting: false

menu:
  main:
    - identifier: research
      name: Research
      url: /research/
      weight: 10
    - identifier: teaching
      name: Teaching
      url: /teaching/
      weight: 20
    - identifier: cv
      name: CV
      url: /cv/
      weight: 30
    - identifier: impact
      name: Impact
      url: /impact/
      weight: 40

markup:
  goldmark:
    renderer:
      unsafe: true
